name: Compile CMS Content

on:
  push:
    branches:
      - main
    paths:
      - 'generate_video_data.py'
      - 'recent-releases/**'
      - 'the-media-hub/**'
      - 'latest-coming-soon/**'
      - 'premiering-2026/**'
      - 'exclusive-bts-stills/**'
      - 'newsroom/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install PyYAML

    - name: Run content compilation script
      run: python generate_video_data.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff --staged --quiet || git commit -m "Automated: Update index.html with latest CMS content"
        git push
