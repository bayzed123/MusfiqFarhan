name: Auto-Publish Latest Updates

on:
  push:
    branches:
      - main
    paths:
      - 'latest-updates/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-updates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Updates
        run: |
          echo "Processing latest updates..."
          mkdir -p _site/updates
          
          if [ -d "latest-updates" ] && [ "$(ls -A latest-updates/*.md 2>/dev/null)" ]; then
            for file in latest-updates/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "_site/updates/$filename"
                echo "✓ Update: $filename"
              fi
            done
          fi
          
          echo "✅ Updates processed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## 📢 Latest Updates Published" >> $GITHUB_STEP_SUMMARY
          echo "✅ Updates have been automatically published!" >> $GITHUB_STEP_SUMMARY
