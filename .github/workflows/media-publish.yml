name: Auto-Publish Media Content

on:
  push:
    branches:
      - main
    paths:
      - 'updates/photos.md'
      - 'updates/videos.md'
      - 'blog/**'
      - 'updates/**'
      - 'audience-zone/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  process-media:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Process Media Files
        run: |
          echo "Processing media files..."
          
          # Create output directories
          mkdir -p _site/media _site/blog _site/updates _site/audience-zone
          
          # Copy main files
          cp index-enhanced.html _site/index.html || cp index.html _site/index.html
          cp profile_*.jpg _site/ 2>/dev/null || true
          cp README.md _site/
          
          # Process photos.md
          if [ -f "updates/photos.md" ]; then
            echo "Processing photo gallery..."
            cp updates/photos.md _site/media/
            cat updates/photos.md >> _site/media-index.txt
          fi
          
          # Process videos.md
          if [ -f "updates/videos.md" ]; then
            echo "Processing video gallery..."
            cp updates/videos.md _site/media/
            cat updates/videos.md >> _site/media-index.txt
          fi
          
          # Process blog posts
          if [ -d "blog" ] && [ "$(ls -A blog/*.md 2>/dev/null)" ]; then
            echo "Processing blog posts..."
            for file in blog/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "_site/blog/$filename"
                echo "✓ Blog: $filename"
              fi
            done
          fi
          
          # Process updates
          if [ -d "updates" ] && [ "$(ls -A updates/*.md 2>/dev/null)" ]; then
            echo "Processing updates..."
            for file in updates/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                if [ "$filename" != "photos.md" ] && [ "$filename" != "videos.md" ]; then
                  cp "$file" "_site/updates/$filename"
                  echo "✓ Update: $filename"
                fi
              fi
            done
          fi
          
          # Process audience zone
          if [ -d "audience-zone" ] && [ "$(ls -A audience-zone/*.md 2>/dev/null)" ]; then
            echo "Processing audience reviews..."
            for file in audience-zone/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "_site/audience-zone/$filename"
                echo "✓ Review: $filename"
              fi
            done
          fi
          
          # Create manifest
          cat > _site/manifest.json << 'EOF'
          {
            "name": "Musfiq R. Farhan Portfolio",
            "description": "Official portfolio with advanced media management",
            "version": "2.0",
            "lastUpdated": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sections": {
              "blog": "blog",
              "updates": "updates",
              "media": "media",
              "audienceZone": "audience-zone"
            },
            "features": [
              "Photo Gallery",
              "Video Embedding",
              "Google Drive Integration",
              "Social Media Links",
              "Automatic Processing"
            ]
          }
          EOF
          
          echo "✅ Media processing complete"
          echo "Generated files:"
          find _site -type f -name "*.md" -o -name "*.json" | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment summary
        run: |
          echo "## 🎬 Media Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Portfolio deployed with media content!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Processed Content:" >> $GITHUB_STEP_SUMMARY
          echo "- 📸 Photo Gallery" >> $GITHUB_STEP_SUMMARY
          echo "- 🎥 Video Embeds" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Blog Posts" >> $GITHUB_STEP_SUMMARY
          echo "- 📢 Updates" >> $GITHUB_STEP_SUMMARY
          echo "- 👥 Audience Reviews" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Supported Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- Google Drive (Photos)" >> $GITHUB_STEP_SUMMARY
          echo "- YouTube (Videos)" >> $GITHUB_STEP_SUMMARY
          echo "- Instagram (Videos)" >> $GITHUB_STEP_SUMMARY
          echo "- Facebook (Videos)" >> $GITHUB_STEP_SUMMARY
