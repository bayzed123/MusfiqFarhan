name: Auto-Publish Content

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - 'updates/**'
      - 'audience-zone/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Process Markdown Files
        run: |
          # Create output directory
          mkdir -p _site/blog _site/updates _site/audience-zone
          
          # Copy index.html
          cp index.html _site/
          
          # Copy profile images
          if [ -f "profile_1.jpg" ]; then cp profile_1.jpg _site/; fi
          if [ -f "profile_2.jpg" ]; then cp profile_2.jpg _site/; fi
          
          # Process blog posts
          if [ -d "blog" ] && [ "$(ls -A blog/*.md 2>/dev/null)" ]; then
            for file in blog/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file" .md)
                echo "Processing blog: $filename"
                # Convert markdown to HTML (basic conversion)
                cat "$file" > "_site/blog/${filename}.md"
              fi
            done
          fi
          
          # Process updates
          if [ -d "updates" ] && [ "$(ls -A updates/*.md 2>/dev/null)" ]; then
            for file in updates/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file" .md)
                echo "Processing update: $filename"
                cat "$file" > "_site/updates/${filename}.md"
              fi
            done
          fi
          
          # Process audience zone
          if [ -d "audience-zone" ] && [ "$(ls -A audience-zone/*.md 2>/dev/null)" ]; then
            for file in audience-zone/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file" .md)
                echo "Processing audience: $filename"
                cat "$file" > "_site/audience-zone/${filename}.md"
              fi
            done
          fi
          
          # Create a manifest file
          cat > _site/manifest.json << 'EOF'
          {
            "name": "Musfiq R. Farhan Portfolio",
            "description": "Official portfolio of Bangladeshi actor and entertainer Musfiq R. Farhan",
            "author": "Musfiq R. Farhan",
            "lastUpdated": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sections": {
              "blog": "blog",
              "updates": "updates",
              "audienceZone": "audience-zone"
            }
          }
          EOF
          
          echo "✅ Content processing complete"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Website deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Content:" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 Main Portfolio: index.html" >> $GITHUB_STEP_SUMMARY
          if [ -d "_site/blog" ] && [ "$(ls -A _site/blog)" ]; then
            echo "- 📝 Blog Posts: $(ls _site/blog | wc -l) files" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "_site/updates" ] && [ "$(ls -A _site/updates)" ]; then
            echo "- 📢 Updates: $(ls _site/updates | wc -l) files" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "_site/audience-zone" ] && [ "$(ls -A _site/audience-zone)" ]; then
            echo "- 👥 Audience Zone: $(ls _site/audience-zone | wc -l) files" >> $GITHUB_STEP_SUMMARY
          fi
