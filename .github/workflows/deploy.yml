name: Deploy MRF website and API

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Regenerate the static pages a few times a day so anything published from
  # the dashboard gets its pre-rendered page and sitemap entry without waiting
  # for the next code change.
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mrf-production
  cancel-in-progress: true

env:
  MRF_API_URL: https://mrf-api.gadget02030.workers.dev

jobs:
  deploy-api:
    name: Deploy MRF-API Worker
    runs-on: ubuntu-latest
    # The Worker only changes on a push; a scheduled run just rebuilds pages.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply MRF-API --remote --config ../wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --config ../wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure admin secrets
        run: |
          printf '%s' "${{ secrets.ADMIN_USER_NAME }}" | npx --yes wrangler@4 secret put ADMIN_USER_NAME --config ../wrangler.toml
          printf '%s' "${{ secrets.ADMIN_PASWORD }}" | npx --yes wrangler@4 secret put ADMIN_PASSWORD --config ../wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The service account reads Analytics and Search Console. It lives as a
      # GitHub secret, but the Worker is what calls Google, so it has to be
      # copied across — a browser can never hold a private key.
      #
      # The secret is read through `env` rather than interpolated into the
      # script, for two reasons. `secrets` is not one of the contexts allowed
      # in a step's `if`, and using it there is not ignored: it fails the whole
      # workflow before a single job starts. And the value is a JSON document
      # with quotes and newlines in it, which pasted straight into a shell
      # command line would not survive intact.
      - name: Configure Google read-only access
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT" ]; then
            echo "No Google service account set; skipping. Analytics and Search Console will report as not connected."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT" | npx --yes wrangler@4 secret put GOOGLE_SERVICE_ACCOUNT --config ../wrangler.toml
          if [ -n "$GA4_PROPERTY_ID" ]; then
            printf '%s' "$GA4_PROPERTY_ID" | npx --yes wrangler@4 secret put GA4_PROPERTY_ID --config ../wrangler.toml
          else
            echo "No GA4 property id set; view counts will stay hidden."
          fi
        working-directory: worker
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  build-site:
    name: Build and verify the site
    runs-on: ubuntu-latest
    needs: [deploy-api]
    # Run even when deploy-api was skipped by the schedule, but not if it failed.
    if: always() && needs.deploy-api.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5

      - name: Generate pages, sitemaps and shell
        run: node scripts/build-site.mjs

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      # Verify taxonomy routing before the browser suite. A mismatch here
      # must block publication rather than silently misfile an item.
      - name: Verify canonical content routing
        run: node scripts/test-routing.mjs

      - name: Verify Love Notes form and avatar upload
        run: node scripts/test-love-notes.mjs

      - name: Verify admin gallery pipeline routing
        run: node scripts/test-admin-media-routing.mjs

      # Verify the built output before it is published, so a broken build
      # never reaches the live site.
      - name: Verify the build
        run: npx playwright test

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Save Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy-site:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify the live site
    runs-on: ubuntu-latest
    needs: deploy-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run the suite against production
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://www.musfiqrfarhan.blog
