name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Site
        run: |
          echo "Building website..."
          
          # Create _site directory
          mkdir -p _site
          
          # Copy main index.html
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
            echo "✅ index.html copied"
          fi
          
          # Function to copy markdown files
          copy_markdown_files() {
            SOURCE_DIR="$1"
            TARGET_DIR="$2"

            mkdir -p "_site/$TARGET_DIR"

            if [ -d "$SOURCE_DIR" ] && compgen -G "$SOURCE_DIR/*.md" > /dev/null; then
              echo "📂 Copying markdown files from $SOURCE_DIR to _site/$TARGET_DIR"

              for file in "$SOURCE_DIR"/*.md; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  cp "$file" "_site/$TARGET_DIR/$filename"
                  echo "✔ Copied: $filename"
                fi
              done
            else
              echo "⚠ No markdown files found in $SOURCE_DIR"
            fi
          }

          # Copy project folders
          copy_markdown_files "recent-releases" "recent-releases"
          copy_markdown_files "the-media-hub" "the-media-hub"
          copy_markdown_files "latest-coming-soon" "latest-coming-soon"
          copy_markdown_files "premiering-2026" "premiering-2026"
          copy_markdown_files "exclusive-bts-stills" "exclusive-bts-stills"
          copy_markdown_files "newsroom" "newsroom"

          # Copy assets folder
          if [ -d "assets" ]; then
            cp -r assets _site/
            echo "✅ assets folder copied"
          fi
          
          echo "📁 Final _site structure:"
          ls -la _site/
          find _site -type f

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4