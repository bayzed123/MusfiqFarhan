name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Site
        shell: bash
        run: |
          echo "🚀 Starting automatic GitHub Pages build..."

          # Clean old build
          rm -rf _site
          mkdir -p _site

          # Copy main index.html
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
            echo "✅ index.html copied"
          else
            echo "❌ index.html not found"
          fi

          # Function to auto copy markdown files
          copy_markdown_files () {
            SOURCE_DIR="$1"
            TARGET_DIR="$2"

            mkdir -p "_site/$TARGET_DIR"

            if [ -d "$SOURCE_DIR" ]; then
              echo "📂 Processing: $SOURCE_DIR"

              shopt -s nullglob
              files=("$SOURCE_DIR"/*.md)

              if [ ${#files[@]} -gt 0 ]; then
                for file in "${files[@]}"; do
                  filename=$(basename "$file")
                  cp "$file" "_site/$TARGET_DIR/$filename"
                  echo "✔ Copied: $filename"
                done
              else
                echo "⚠ No markdown files inside $SOURCE_DIR"
              fi
            else
              echo "⚠ Directory not found: $SOURCE_DIR"
            fi
          }

          # Auto process all project folders
          copy_markdown_files "recent-releases" "recent-releases"
          copy_markdown_files "the-media-hub" "the-media-hub"
          copy_markdown_files "latest-coming-soon" "latest-coming-soon"
          copy_markdown_files "premiering-2026" "premiering-2026"
          copy_markdown_files "exclusive-bts-stills" "exclusive-bts-stills"
          copy_markdown_files "newsroom" "newsroom"

          # Copy assets folder automatically
          if [ -d "assets" ]; then
            cp -r assets _site/
            echo "✅ assets folder copied"
          else
            echo "⚠ assets folder not found"
          fi

          echo ""
          echo "📦 Final _site structure:"
          find _site -type f

          echo ""
          echo "✅ Build completed successfully"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4