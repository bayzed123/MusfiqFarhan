name: Deploy Website

on:
  push:
    branches:
      - main
  # এটি যোগ করেছি যাতে কম্পাইল হওয়ার পর অটোমেটিক রান হয়
  workflow_run:
    workflows: ["Compile CMS Content"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Site
        run: |
          echo "Preparing site for deployment..."
          mkdir -p _site
          # আপনার পুরো প্রজেক্টের ফাইলগুলো _site এ কপি হচ্ছে
          cp -r ./* _site/ || true
          # পাইথন এবং গিটহাবের অপ্রয়োজনীয় ফাইল মুছে দিচ্ছি
          rm -rf _site/.github _site/.git _site/*.yml _site/*.py _site/*.md
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4