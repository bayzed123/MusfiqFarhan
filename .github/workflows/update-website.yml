name: Update Website Content

on:
  push:
    branches:
      - main
    paths:
      - 'recent-releases/**'
      - 'the-media-hub/**'
      - 'latest-coming-soon/**'
      - 'premiering-2026/**'
      - 'exclusive-bts-stills/**'
      - 'newsroom/**'
      - 'update_index.py'

jobs:
  update-content:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Important: This token is required to push changes back to the repository
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install pyyaml beautifulsoup4

    - name: Run content update script
      run: python update_index.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff --staged --quiet || git commit -m "Automated: Update index.html with latest content"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
