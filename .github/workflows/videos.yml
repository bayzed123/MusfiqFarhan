name: Auto-Publish Videos

on:
  push:
    branches:
      - main
    paths:
      - 'videos/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-videos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Videos
        run: |
          echo "Processing videos..."
          mkdir -p _site/videos
          
          if [ -d "videos" ] && [ "$(ls -A videos/*.md 2>/dev/null)" ]; then
            for file in videos/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "_site/videos/$filename"
                echo "✓ Video: $filename"
              fi
            done
          fi
          
          echo "✅ Videos processed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## 🎥 Videos Published" >> $GITHUB_STEP_SUMMARY
          echo "✅ Video gallery has been automatically updated!" >> $GITHUB_STEP_SUMMARY
