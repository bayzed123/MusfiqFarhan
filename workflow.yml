
name: Update Video Carousels

on:
  push:
    branches:
      - main
    paths:
      - 'recent-releases/**'
      - 'the-media-hub/**'
      - 'generate_video_data.py'

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install PyYAML

    - name: Run script to generate video data
      run: python generate_video_data.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "chore: Automated update of video data in index.html"
        git push
