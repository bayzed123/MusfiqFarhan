<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musfiq R. Farhan | Official Premium Portfolio</title>
    <meta name="description" content="Official portfolio of Musfiq R. Farhan - Renowned Bangladeshi Actor, RJ, and Content Creator.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    
    <style>
        :root {
            --midnight: #05070a;
            --emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.3);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--midnight);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3, .luxury-font {
            font-family: 'Playfair Display', serif;
        }

        .cinematic-font {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--midnight);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--emerald);
            border-radius: 10px;
        }

        /* --- Global Elements --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .section-padding {
            padding: 120px 0;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            transition: var(--transition-smooth);
        }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--emerald);
            color: var(--midnight);
            box-shadow: 0 10px 20px var(--emerald-glow);
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px var(--emerald-glow);
            background: #fff;
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid var(--glass-border);
        }

        .btn-outline:hover {
            background: var(--glass);
            border-color: #fff;
        }

        /* --- Navigation --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 25px 0;
            transition: var(--transition-smooth);
        }

        header.scrolled {
            background: rgba(5, 7, 10, 0.8);
            backdrop-filter: blur(20px);
            padding: 15px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--emerald);
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-smooth);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--emerald);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            z-index: 1001;
            flex-direction: column;
            gap: 6px;
        }

        .hamburger div {
            width: 25px;
            height: 2px;
            background-color: #fff;
            transition: 0.4s;
        }

        .hamburger.active div:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .hamburger.active div:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active div:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 70px;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(5, 7, 10, 0) 0%, rgba(5, 7, 10, 0.3) 40%, rgba(5, 7, 10, 0.8) 70%, rgba(0, 0, 0, 1) 100%), 
                        url('./assets/hero-portrait.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
            transform: scale(1.1);
            transition: transform 10s ease-out;
        }

        .hero:hover .hero-bg {
            transform: scale(1);
        }

        .hero-content {
            text-align: center;
            max-width: 900px;
        }

        .hero-subtitle {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: var(--emerald);
            margin-bottom: 20px;
            display: block;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s forwards 0.5s;
        }

        .hero-title {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            margin-bottom: 30px;
            line-height: 1.1;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s forwards 0.8s;
        }

        .hero-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s forwards 1.1s;
            flex-wrap: wrap;
        }

        /* --- Love Notes Hub --- */
        .love-notes-hub {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(212, 175, 55, 0.02) 100%);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
        }

        .love-notes-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .love-notes-header h2 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .love-notes-header p {
            color: var(--text-dim);
            font-size: 16px;
        }

        .love-notes-form-container {
            max-width: 600px;
            margin: 0 auto 80px;
        }

        .love-notes-form {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-dim);
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition-smooth);
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--emerald);
            background: rgba(16, 185, 129, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .love-notes-form .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 14px;
        }

        /* --- Multi-Row Marquee Display --- */
        .love-notes-marquee-section {
            margin-top: 60px;
        }

        .marquee-row {
            overflow: hidden;
            background: rgba(16, 185, 129, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 0;
            min-height: 140px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .marquee-track {
            display: flex;
            gap: 30px;
            padding: 0 30px;
            will-change: transform;
        }

        .marquee-track-1 {
            animation: marqueeScrollLeft 30s linear infinite;
        }

        .marquee-track-2 {
            animation: marqueeScrollRight 35s linear infinite;
        }

        .marquee-track-3 {
            animation: marqueeScrollLeft 32s linear infinite;
        }

        .marquee-row:hover .marquee-track {
            animation-play-state: paused;
        }

        .love-note-card {
            flex: 0 0 auto;
            min-width: 320px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            transition: var(--transition-smooth);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .love-note-card:hover {
            border-color: var(--emerald);
            background: rgba(16, 185, 129, 0.12);
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.15);
            transform: translateY(-5px);
        }

        .love-note-message {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
            font-style: italic;
            line-height: 1.5;
        }

        .love-note-author {
            color: var(--emerald);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .marquee-placeholder {
            text-align: center;
            color: var(--text-dim);
            font-style: italic;
            width: 100%;
            padding: 40px;
        }

        @keyframes marqueeScrollLeft {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-50%);
            }
        }

        @keyframes marqueeScrollRight {
            from {
                transform: translateX(-50%);
            }
            to {
                transform: translateX(0);
            }
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 992px) {
            .hero-title { font-size: 4rem; }
        }

        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                right: -100%;
                top: 70px;
                height: calc(100vh - 70px);
                width: 100%;
                background: var(--midnight);
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                transition: 0.5s;
                z-index: 999;
                padding-top: 40px;
                gap: 20px;
            }
            .nav-links.active { right: 0; }
            .hamburger { display: flex; }
            .hero-title { font-size: 3rem; }
            .hero { margin-top: 0; }
            .hero-bg { background-position: 85% center; }
            .marquee-row { min-height: 120px; }
            .love-note-card { min-width: 280px; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header id="header">
        <div class="nav-container">
            <a href="#" class="logo cinematic-font">MUSFIQ<span>.</span></a>
            <nav class="nav-links" id="nav-links">
                <a href="#home" class="active">Home</a>
                <a href="#filmography">Filmography</a>
                <a href="#about">About</a>
                <a href="#love-notes">Live Fan Wall</a>
                <a href="#news">News</a>
                <a href="#contact">Contact</a>
            </nav>
            <div class="hamburger" id="hamburger">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </header>

    <!-- 1. Immersive Hero Poster -->
    <section class="hero" id="home">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <span class="hero-subtitle cinematic-font">Award Winning Actor</span>
            <h1 class="hero-title luxury-font">Hello, I'm Musfiq R. Farhan</h1>
            <div class="hero-btns">
                <a href="#love-notes" class="btn btn-primary">Explore Filmography</a>
                <a href="#contact" class="btn btn-outline">Inquiry</a>
            </div>
        </div>
    </section>

    <!-- 7. THE LIVE FAN WALL (MULTI-ROW MARQUEE) -->
    <section class="section-padding love-notes-hub" id="love-notes">
        <div class="container">
            <div class="love-notes-header reveal">
                <h2 class="luxury-font">Live Fan Wall</h2>
                <p>Global community of millions sharing their love in real-time</p>
            </div>

            <!-- Input Section -->
            <div class="love-notes-form-container reveal">
                <form class="love-notes-form" id="love-notes-form">
                    <div class="form-group">
                        <label for="fan-name">Your Name</label>
                        <input type="text" id="fan-name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="fan-message">Your Message</label>
                        <textarea id="fan-message" placeholder="Share your love and support..." required maxlength="150"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Love</button>
                </form>
            </div>

            <!-- Multi-Row Infinite Marquee Display -->
            <div class="love-notes-marquee-section reveal">
                <!-- Row 1: Scroll Right-to-Left -->
                <div class="marquee-row">
                    <div class="marquee-track marquee-track-1" id="marquee-row-1">
                        <div class="marquee-placeholder">Loading live messages...</div>
                    </div>
                </div>
                <!-- Row 2: Scroll Left-to-Right -->
                <div class="marquee-row">
                    <div class="marquee-track marquee-track-2" id="marquee-row-2">
                        <div class="marquee-placeholder">Loading live messages...</div>
                    </div>
                </div>
                <!-- Row 3: Scroll Right-to-Left -->
                <div class="marquee-row">
                    <div class="marquee-track marquee-track-3" id="marquee-row-3">
                        <div class="marquee-placeholder">Loading live messages...</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script>
        // ===== FIREBASE CONFIGURATION =====
        // IMPORTANT: Replace these placeholder values with your actual Firebase project credentials
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_AUTH_DOMAIN_HERE",
            databaseURL: "YOUR_DATABASE_URL_HERE",
            projectId: "YOUR_PROJECT_ID_HERE",
            storageBucket: "YOUR_STORAGE_BUCKET_HERE",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID_HERE",
            appId: "YOUR_APP_ID_HERE"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();
            const loveNotesRef = database.ref('love_notes');
            console.log('Firebase initialized successfully');
        } catch (error) {
            console.warn('Firebase not configured yet. Please add your Firebase credentials.');
        }

        // ===== LOVE NOTES SYSTEM =====
        let allNotes = [];

        // Render multi-row marquee with love notes
        function renderMultiRowMarquee() {
            if (allNotes.length === 0) {
                document.getElementById('marquee-row-1').innerHTML = '<div class="marquee-placeholder">Be the first to leave a message! 💚</div>';
                document.getElementById('marquee-row-2').innerHTML = '<div class="marquee-placeholder">Be the first to leave a message! 💚</div>';
                document.getElementById('marquee-row-3').innerHTML = '<div class="marquee-placeholder">Be the first to leave a message! 💚</div>';
                return;
            }

            // Distribute notes across 3 rows
            const row1Notes = [];
            const row2Notes = [];
            const row3Notes = [];

            allNotes.forEach((note, index) => {
                const row = index % 3;
                if (row === 0) row1Notes.push(note);
                else if (row === 1) row2Notes.push(note);
                else row3Notes.push(note);
            });

            // Render each row
            renderRow('marquee-row-1', row1Notes);
            renderRow('marquee-row-2', row2Notes);
            renderRow('marquee-row-3', row3Notes);
        }

        function renderRow(rowId, notes) {
            const rowElement = document.getElementById(rowId);
            if (notes.length === 0) {
                rowElement.innerHTML = '<div class="marquee-placeholder">Loading...</div>';
                return;
            }

            let html = '';
            notes.forEach(note => {
                html += `
                    <div class="love-note-card">
                        <div class="love-note-message">"${note.message}"</div>
                        <div class="love-note-author">- ${note.name}</div>
                    </div>
                `;
            });
            // Duplicate for seamless infinite loop
            html += html;
            rowElement.innerHTML = html;
        }

        // Listen for Firebase updates
        function setupFirebaseListener() {
            try {
                loveNotesRef.on('value', (snapshot) => {
                    allNotes = [];
                    snapshot.forEach((childSnapshot) => {
                        allNotes.push(childSnapshot.val());
                    });
                    // Sort by timestamp (newest first)
                    allNotes.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    renderMultiRowMarquee();
                });
            } catch (error) {
                console.log('Firebase listener not available. Using local data only.');
            }
        }

        // Handle form submission
        document.getElementById('love-notes-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('fan-name').value.trim();
            const message = document.getElementById('fan-message').value.trim();
            
            if (!name || !message) return;
            
            const newNote = {
                name: name,
                message: message,
                timestamp: new Date().toISOString()
            };

            // Try to save to Firebase
            try {
                loveNotesRef.push(newNote);
            } catch (error) {
                console.log('Firebase not available. Note saved locally.');
                allNotes.push(newNote);
                renderMultiRowMarquee();
            }

            // Clear form
            this.reset();
            
            // Show success feedback
            const btn = this.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Love Sent! 💚';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        });

        // ===== STICKY HEADER =====
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ===== MOBILE MENU =====
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            hamburger.classList.toggle('active');
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                hamburger.classList.remove('active');
            });
        });

        // ===== REVEAL ON SCROLL =====
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 150;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);

        // ===== SMOOTH SCROLLING =====
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', () => {
            setupFirebaseListener();
            reveal();
        });
    </script>
</body>
</html>
